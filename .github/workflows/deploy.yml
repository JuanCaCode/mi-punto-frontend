name: Deploy a produccion (Vercel)

# Despliegue continuo: solo al hacer merge / push a main.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend en Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Descargar configuracion de produccion de Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Inyectar VITE_API_URL en el entorno de build de Vercel
        run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then
            echo "::error::Falta la Variable de Actions VITE_API_URL (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          # 'vercel build' NO hereda el entorno del runner: reconstruye process.env
          # SOLO desde .vercel/.env.production.local (lo crea 'vercel pull').
          # Ademas, Vite da prioridad a process.env sobre los archivos .env, asi que
          # hay que fijar el valor EN ese archivo (eliminando cualquier valor vacio).
          ENV_FILE=.vercel/.env.production.local
          touch "$ENV_FILE"
          sed -i '/^VITE_API_URL=/d' "$ENV_FILE"
          echo "VITE_API_URL=${{ vars.VITE_API_URL }}" >> "$ENV_FILE"
          # Respaldo: archivo nativo de Vite (por si el build no toma el de Vercel).
          echo "VITE_API_URL=${{ vars.VITE_API_URL }}" > .env.production.local
          echo "Build apuntara a: ${{ vars.VITE_API_URL }}"
          echo "--- .vercel/.env.production.local ---"
          cat "$ENV_FILE"

      - name: Build de produccion (Vercel)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Desplegar artefacto a produccion
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
