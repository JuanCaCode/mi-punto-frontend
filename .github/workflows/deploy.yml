name: Deploy a produccion (Vercel)

# Despliegue continuo: solo al hacer merge / push a main.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend en Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Descargar configuracion de produccion de Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build de produccion (Vercel)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          # VITE_API_URL es variable de BUILD-TIME (Vite la incrusta en el bundle).
          # Se inyecta aqui para no depender del entorno configurado en Vercel.
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Desplegar artefacto a produccion
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
