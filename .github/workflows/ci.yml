name: CI

# Integracion continua del frontend (Vite + React + TypeScript).
# Se ejecuta en cada Pull Request hacia main y en cada push a main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Lint + unitarias (coverage 85%) + build ----------
  unit:
    name: Lint, Unitarias (coverage) y Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint del codigo (ESLint)
        run: npm run lint

      - name: Pruebas unitarias + coverage (gate 85%)
        run: npm run test:coverage

      - name: Build del proyecto
        run: npm run build

  # ---------- End-to-End (Playwright) contra el stack local ----------
  e2e:
    name: Pruebas E2E (Playwright)
    runs-on: ubuntu-latest

    # Base de datos PostGIS para el backend durante los E2E.
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: mi_punto
          POSTGRES_USER: mipunto
          POSTGRES_PASSWORD: mipunto
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mipunto -d mi_punto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://mipunto:mipunto@localhost:5433/mi_punto
      VITE_API_URL: http://localhost:8000

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      # El backend vive en un repo aparte del mismo owner. Si es privado,
      # reemplazar el token por un PAT con acceso (secrets.BACKEND_REPO_TOKEN).
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/mi-punto-backend
          ref: main
          path: backend

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Migrar y sembrar datos demo
        working-directory: backend
        run: |
          alembic upgrade head
          python seed.py

      - name: Levantar el backend (uvicorn)
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          # Esperar a que /health responda.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Backend listo"; exit 0
            fi
            sleep 1
          done
          echo "El backend no respondio a tiempo"; cat backend.log; exit 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar navegador de Playwright
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Ejecutar pruebas E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Publicar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
