name: CI

# Integracion continua del frontend (Vite + React + TypeScript).
# Se ejecuta en cada Pull Request hacia main y en cada push a main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Test y Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint del codigo (ESLint)
        run: npm run lint

      - name: Pruebas automatizadas (Vitest)
        run: npm test

      - name: Build del proyecto
        run: npm run build
